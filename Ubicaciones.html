<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET STYLE & STREER 3D</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="icon" type="image/x-icon" href="Mi_logo.png">
    
    <style>
        :root {
            --fondo: #12100e; 
            --tarjeta: #1e1b18; 
            --acento: #585858; 
            --texto: #f5f5f5;
        }

        body {
            background: radial-gradient(circle at top, #241f1c 0%, #12100e 100%);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .main-logo {
            max-width: 120px;
            height: auto;
            border-radius: 50%;
            border: 2px solid var(--acento);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.4rem;
            margin-bottom: 2.5rem;
            color: var(--acento);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 4px 4px 0px rgba(0,0,0,1);
            transform: rotate(-2deg);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: var(--tarjeta);
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--texto);
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 159, 67, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .link-card:hover {
            border-color: var(--acento);
            transform: scale(1.05);
            background-color: #282421;
            box-shadow: 0 10px 25px rgba(255, 159, 67, 0.15);
        }

        .link-card i {
            margin-right: 12px;
            font-size: 1.4rem;
            width: 24px;
            text-align: center;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="Mi_logo.png" alt="Logo Street Style" class="main-logo">
        </div>

        <h1>STREET STYLE & 3D</h1>
        
        <div class="links-container">

            <a href="https://maps.app.goo.gl/HRZA6o6hZFgFyBBeA" class="link-card" target="_blank">
                <i class="fa-solid fa-location-dot"></i> Refugio
            </a>

            <a href="https://maps.app.goo.gl/HRZA6o6hZFgFyBBeA" class="link-card" target="_blank">
                <i class="fa-solid fa-location-dot"></i> Street Syle
            </a>

            <a href="index.html" class="link-card">
                <i class="fa-solid fa-arrow-left"></i> Regresar
            </a>
        </div>

        <p class="footer">© 2026 • STREET STYLE & 3D • DEV & ART</p>
    </div>

</body>
</html>
